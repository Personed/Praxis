name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar, renderer and service binaries
        run: npm --workspace @modus/desktop run build

      - name: Stage bundled binaries (node, pty-host, supervisors, codegraph)
        run: node apps/desktop/scripts/stage-bundle-bin.mjs

      - name: Tauri build
        run: npm --workspace @modus/desktop exec -- tauri build -- --target ${{ matrix.rust_target }}
        env:
          MODUS_REA_RUST_TARGET: ${{ matrix.rust_target }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage.tar.gz.sig
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.nsis.zip
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.nsis.zip.sig
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.nsis.zip
            apps/desktop/src-tauri/target/release/bundle/**/*.nsis.zip.sig
          if-no-files-found: warn

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true

      - name: Generate latest.json updater manifest
        run: node apps/desktop/scripts/release/latest-json.mjs dist "${{ github.ref_name }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Modus ${{ github.ref_name }}" \
            --generate-notes \
            --repo "$GH_REPO"
