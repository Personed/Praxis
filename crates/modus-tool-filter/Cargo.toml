[package]
name = "modus-tool-filter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "modus-tool-filter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
